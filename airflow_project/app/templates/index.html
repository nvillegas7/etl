<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>MLB Odds EV</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 2rem; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; }
      th { background: #f5f5f5; }
      .positive { color: green; }
      .negative { color: red; }
    </style>
  </head>
  <body>
    <h1>MLB Odds EV Analysis</h1>
    <table>
      <thead>
        <tr>
          <th>MATCH (UTC)</th>
          <th>TAB</th>
          <th>FAIR</th>
          <th>EV_%</th>
          <th>SIDE</th>
        </tr>
      </thead>
      <tbody>
        {% for r in rows %}
        <tr>
          <td>{{ r.match }}</td>
          <td>{{ r.tab }}</td>
          <td>{{ r.fair }}</td>
          <td class="{{ 'positive' if r.ev >= 0 else 'negative' }}">
            {{ '+' if r.ev >= 0 else '' }}{{ "%.1f"|format(r.ev) }}%
          </td>
          <td>{{ r.side }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
